[build]
  publish = "."

# ---------------------------------------------------------------------------
# scott.tourcwe.com - Scott Pinson's friends-and-family booking link.
# Cloudflare wildcard *.tourcwe.com already routes here; Netlify needs the
# alias + this rewrite so the root serves /scott/. Only the bare root is
# rewritten - subpaths fall through so /css, /js, /assets resolve normally.
# Status 200 keeps the visible URL as scott.tourcwe.com.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "https://scott.tourcwe.com/"
  to = "/scott/"
  status = 200
  force = true


[[redirects]]
  from = "/tours"
  to = "/tour/"
  status = 301

[[redirects]]
  from = "/tour"
  to = "/tour/"
  status = 301

# ---------------------------------------------------------------------------
# Legacy URLs from the pre-rebuild site (still indexed by Google, now 404ing).
# Each 301 reclaims the ranking authority by sending it to today's equivalent.
# Initial batch added 2026-04-22; SEO sprint additions 2026-04-26 below.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/contact"
  to = "/tour/#book"
  status = 301

[[redirects]]
  from = "/dressels"
  to = "/blog/dressels-public-house/"
  status = 301

[[redirects]]
  from = "/gramophone"
  to = "/blog/gramophone/"
  status = 301

[[redirects]]
  from = "/straubs"
  to = "/blog/straubs-market/"
  status = 301

[[redirects]]
  from = "/havanas"
  to = "/blog/havanas-cuisine/"
  status = 301

[[redirects]]
  from = "/omg"
  to = "/blog/omg-in-the-cwe/"
  status = 301

# 2026-04-26 SEO sprint additions: GSC showed these old paths still
# indexed and bleeding impressions into 404s. Verified targets via
# racon.tours archive.

[[redirects]]
  from = "/the-perfect-st-louis-food-tour"
  to = "/tour/"
  status = 301

# Specific product slugs from the old /tours/iconicstl/ taxonomy
# (715 + 112 impressions over last 90 days). MUST come before the
# /tours/* catch-all below.

[[redirects]]
  from = "/tours/iconicstl/iconic-stl-flavors-central-west-end-food-history-walking-tour"
  to = "/tour/"
  status = 301

[[redirects]]
  from = "/tours/iconicstl/omg-in-the-cwe-best-of-the-central-west-end-food-history-tour"
  to = "/blog/omg-in-the-cwe/"
  status = 301

# Catch-all for any other /tours/<deep-path> still floating in the index.
[[redirects]]
  from = "/tours/*"
  to = "/tour/"
  status = 301

# ---------------------------------------------------------------------------
# 2026-10-05 — Forest Park Picnics wound down; all old picnic, menu and
# partner URLs now land on the food tour.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/picnics/art-hill"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnics/art-hill/*"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnics/muny"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnics/muny/*"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnic"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnic/*"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnics"
  to = "/tour/"
  status = 301
  force = true

[[redirects]]
  from = "/picnics/*"
  to = "/tour/"
  status = 301
  force = true

# Legacy partner landing pages (2026-04-26) — now the food tour.

[[redirects]]
  from = "/yeschef"
  to = "/tour/"
  status = 301

[[redirects]]
  from = "/partner"
  to = "/tour/"
  status = 301


# Old menu URL — now the food section of the tour page.
[[redirects]]
  from = "/menu"
  to = "/tour/#food"
  status = 301
  force = true

[[redirects]]
  from = "/menu/*"
  to = "/tour/#food"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
